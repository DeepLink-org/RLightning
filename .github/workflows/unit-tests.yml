name: Unit Tests

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Install project and test dependencies
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python --torch-backend cpu -e '.[dev]'

      - name: Run unit tests
        run: .venv/bin/python -m pytest tests/unit
